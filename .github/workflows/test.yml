# Runs the unit tier and the full regress suite in the test image (tests/image/Dockerfile), on every pull request
# and on main. A rearchitecture step merges only once this job is green (D52, docs/test-image-decisions.md).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NVR_ENGINE: docker
      NVR_IMAGE: nvim-config-test:ci
    steps:
      # The builder's stages, the image and the copy loaded into docker need more than the ~14 GB a runner starts with
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layers cached in the Actions cache: a config-only change rebuilds the plugins stage, not the tools. Only main
      # writes the cache, which takes about 3 minutes with mode=max; a pull request reads main's (a branch's runs may
      # restore its base branch's cache entries)
      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/image/Dockerfile
          tags: ${{ env.NVR_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          # lifts GitHub's anonymous API rate limit for mise's installs; a build secret, never in a layer
          secrets: |
            github_token=${{ github.token }}

      - name: Unit tier
        run: bash mise-tasks/test/image/_default unit
        env:
          NVR_OUT: out/unit

      - name: Regress suite
        if: ${{ !cancelled() }}
        run: bash mise-tasks/test/image/_default suite
        env:
          NVR_OUT: out/suite

      - name: Upload the suite's last/
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regress-last
          path: out/suite/
          if-no-files-found: ignore
